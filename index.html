<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Keep Clone</title>
  <meta name="description" content="A pixel-accurate Google Keep clone built with semantic HTML5, modern CSS3, and modular Vanilla JavaScript.">
  <link rel="icon" type="image/png" href="keep-logo-light.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="responsiveness.css">
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="app-header" id="app-header">
    <div class="header-left">
      <button class="icon-btn" id="menu-btn" aria-label="Main menu" title="Main menu">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="brand-container" id="brand-logo">
        <img src="keep-logo-light.png" alt="Google Keep Logo" class="keep-logo">
        <span class="brand-text">Keep</span>
      </div>
    </div>

    <div class="header-center">
      <div class="search-bar" id="search-bar">
        <button class="icon-btn search-icon-btn" aria-label="Search">
          <span class="material-symbols-outlined">search</span>
        </button>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search" 
          autocomplete="off"
          aria-label="Search notes"
        >
        <button class="icon-btn clear-search-btn" id="clear-search-btn" aria-label="Clear search" title="Clear search">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </div>

    <div class="header-right">
      <button class="icon-btn" id="refresh-btn" aria-label="Refresh" title="Refresh">
        <span class="material-symbols-outlined">refresh</span>
      </button>
      <button class="icon-btn" id="layout-toggle-btn" aria-label="List view" title="Toggle view layout">
        <span class="material-symbols-outlined" id="layout-icon">view_agenda</span>
      </button>
      <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle dark mode" title="Toggle theme">
        <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
      </button>
      <button class="icon-btn" id="apps-btn" aria-label="Google apps" title="Google apps">
        <span class="material-symbols-outlined">apps</span>
      </button>
      <div class="user-profile" id="user-profile" title="Google Account">
        <div class="avatar-ring">
          <img src="account-image.png" alt="Profile avatar" class="avatar-img">
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== APP BODY WRAPPER ==================== -->
  <div class="app-container" id="app-container">
    
    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav" id="sidebar-nav">
        <ul class="nav-list">
          <li class="nav-item active" data-view="notes" id="nav-notes">
            <button class="nav-link" aria-label="Notes">
              <span class="icon-wrapper">
                <span class="material-symbols-outlined nav-icon">lightbulb_2</span>
              </span>
              <span class="nav-label">Notes</span>
            </button>
          </li>
          <li class="nav-item" data-view="reminders" id="nav-reminders">
            <button class="nav-link" aria-label="Reminders">
              <span class="icon-wrapper">
                <span class="material-symbols-outlined nav-icon">notifications</span>
              </span>
              <span class="nav-label">Reminders</span>
            </button>
          </li>
          <li class="nav-item" data-view="inspiration" id="nav-inspiration">
            <button class="nav-link" aria-label="Inspiration">
              <span class="icon-wrapper">
                <span class="material-symbols-outlined nav-icon">label</span>
              </span>
              <span class="nav-label">Inspiration</span>
            </button>
          </li>
          <li class="nav-item" data-view="personal" id="nav-personal">
            <button class="nav-link" aria-label="Personal">
              <span class="icon-wrapper">
                <span class="material-symbols-outlined nav-icon">label</span>
              </span>
              <span class="nav-label">Personal</span>
            </button>
          </li>
          <li class="nav-item" data-view="work" id="nav-work">
            <button class="nav-link" aria-label="Work">
              <span class="icon-wrapper">
                <span class="material-symbols-outlined nav-icon">label</span>
              </span>
              <span class="nav-label">Work</span>
            </button>
          </li>
          <li class="nav-item" data-view="edit-labels" id="nav-edit-labels">
            <button class="nav-link" aria-label="Edit labels">
              <span class="icon-wrapper">
                <span class="material-symbols-outlined nav-icon">edit</span>
              </span>
              <span class="nav-label">Edit labels</span>
            </button>
          </li>
          <li class="nav-item" data-view="archive" id="nav-archive">
            <button class="nav-link" aria-label="Archive">
              <span class="icon-wrapper">
                <span class="material-symbols-outlined nav-icon">archive</span>
              </span>
              <span class="nav-label">Archive</span>
            </button>
          </li>
          <li class="nav-item" data-view="bin" id="nav-bin">
            <button class="nav-link" aria-label="Bin">
              <span class="icon-wrapper">
                <span class="material-symbols-outlined nav-icon">delete</span>
              </span>
              <span class="nav-label">Bin</span>
            </button>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="main-content" id="main-content">
      
      <!-- ==================== NOTE CREATOR ==================== -->
      <section class="note-creator-wrapper" id="note-creator-wrapper">
        <div class="note-creator" id="note-creator">
          
          <!-- Collapsed View -->
          <div class="creator-collapsed" id="creator-collapsed">
            <span class="placeholder-text">Take a note...</span>
            <div class="creator-collapsed-actions">
              <button class="icon-btn icon-btn-sm" title="New list" aria-label="New list">
                <span class="material-symbols-outlined">check_box</span>
              </button>
              <button class="icon-btn icon-btn-sm" title="New note with drawing" aria-label="New note with drawing">
                <span class="material-symbols-outlined">brush</span>
              </button>
              <button class="icon-btn icon-btn-sm" title="New note with image" aria-label="New note with image">
                <span class="material-symbols-outlined">image</span>
              </button>
            </div>
          </div>

          <!-- Expanded View -->
          <div class="creator-expanded" id="creator-expanded">
            <div class="creator-header">
              <input 
                type="text" 
                id="new-note-title" 
                class="creator-title-input" 
                placeholder="Title" 
                aria-label="Title"
              >
              <button class="icon-btn icon-btn-sm pin-btn" id="new-note-pin-btn" title="Pin note" aria-label="Pin note">
                <span class="material-symbols-outlined pin-icon">push_pin</span>
              </button>
            </div>
            
            <div class="creator-body">
              <textarea 
                id="new-note-content" 
                class="creator-content-textarea" 
                placeholder="Take a note..." 
                rows="1"
                aria-label="Take a note"
              ></textarea>
            </div>

            <div class="creator-footer">
              <div class="creator-actions">
                <button class="icon-btn icon-btn-sm" title="Remind me" aria-label="Remind me">
                  <span class="material-symbols-outlined">add_alert</span>
                </button>
                <button class="icon-btn icon-btn-sm" title="Collaborator" aria-label="Collaborator">
                  <span class="material-symbols-outlined">person_add</span>
                </button>
                <button class="icon-btn icon-btn-sm" title="Background options" aria-label="Background options">
                  <span class="material-symbols-outlined">palette</span>
                </button>
                <button class="icon-btn icon-btn-sm" title="Add image" aria-label="Add image">
                  <span class="material-symbols-outlined">image</span>
                </button>
                <button class="icon-btn icon-btn-sm" title="Archive" aria-label="Archive">
                  <span class="material-symbols-outlined">archive</span>
                </button>
                <button class="icon-btn icon-btn-sm" title="More" aria-label="More">
                  <span class="material-symbols-outlined">more_vert</span>
                </button>
              </div>
              <button type="button" class="close-btn" id="creator-close-btn">Close</button>
            </div>
          </div>

        </div>
      </section>

      <!-- ==================== NOTES CONTAINER ==================== -->
      <section class="notes-display-area" id="notes-display-area">
        
        <!-- Pinned Section -->
        <div class="notes-section" id="pinned-section" style="display: none;">
          <h2 class="section-title">PINNED</h2>
          <div class="notes-grid" id="pinned-grid"></div>
        </div>

        <!-- Others Section -->
        <div class="notes-section" id="others-section">
          <h2 class="section-title" id="others-title" style="display: none;">OTHERS</h2>
          <div class="notes-grid" id="others-grid"></div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display: none;">
          <div class="empty-icon-container">
            <span class="material-symbols-outlined empty-icon">lightbulb</span>
          </div>
          <p class="empty-text" id="empty-text">Notes that you add appear here</p>
        </div>

      </section>

    </main>
  </div>

  <!-- ==================== EDIT NOTE MODAL ==================== -->
  <div class="modal-backdrop" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card" id="modal-card">
      <div class="modal-header">
        <input 
          type="text" 
          id="modal-title" 
          class="modal-title-input" 
          placeholder="Title"
          aria-label="Edit title"
        >
        <button class="icon-btn icon-btn-sm pin-btn" id="modal-pin-btn" title="Pin note" aria-label="Pin note">
          <span class="material-symbols-outlined pin-icon">push_pin</span>
        </button>
      </div>

      <div class="modal-body">
        <textarea 
          id="modal-content" 
          class="modal-content-textarea" 
          placeholder="Note" 
          aria-label="Edit note content"
        ></textarea>
      </div>

      <div class="modal-footer">
        <div class="modal-actions">
          <button class="icon-btn icon-btn-sm" title="Remind me" aria-label="Remind me">
            <span class="material-symbols-outlined">add_alert</span>
          </button>
          <button class="icon-btn icon-btn-sm" title="Collaborator" aria-label="Collaborator">
            <span class="material-symbols-outlined">person_add</span>
          </button>
          <button class="icon-btn icon-btn-sm" title="Background options" aria-label="Background options">
            <span class="material-symbols-outlined">palette</span>
          </button>
          <button class="icon-btn icon-btn-sm" title="Add image" aria-label="Add image">
            <span class="material-symbols-outlined">image</span>
          </button>
          <button class="icon-btn icon-btn-sm" title="Archive" aria-label="Archive">
            <span class="material-symbols-outlined">archive</span>
          </button>
          <button class="icon-btn icon-btn-sm" id="modal-delete-btn" title="Delete note" aria-label="Delete note">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>
        <button type="button" class="close-btn" id="modal-close-btn">Close</button>
      </div>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
